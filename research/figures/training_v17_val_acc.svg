<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="820" height="456" viewBox="0 0 820 456" role="img">
<style>
.viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9;
  --axis:#c3c2b7; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --h0:#cde2fb; --h1:#9ec5f4; --h2:#6da7ec; --h3:#3987e5; --h4:#256abf; --h5:#184f95; --h6:#0d366b; }
@media (prefers-color-scheme: dark) {
  .viz { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --grid:#2c2c2a; --axis:#383835;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --h0:#0d366b; --h1:#104281; --h2:#184f95; --h3:#1c5cab; --h4:#256abf; --h5:#3987e5; --h6:#6da7ec; } }
.viz text { font-family:system-ui, -apple-system, "Segoe UI", sans-serif; fill:var(--ink2); font-size:11px; }
.viz .title { fill:var(--ink); font-size:15px; font-weight:600; }
.viz .subtitle { fill:var(--ink2); font-size:12px; }
.viz .panel { fill:var(--ink); font-size:12px; font-weight:600; }
.viz .muted { fill:var(--muted); }
.viz .value { fill:var(--ink); font-weight:600; }
.viz .tick { font-variant-numeric:tabular-nums; fill:var(--muted); }
.viz .grid { stroke:var(--grid); stroke-width:1; }
.viz .axis { stroke:var(--axis); stroke-width:1; }
.viz .ref { stroke:var(--muted); stroke-width:1; }
.viz .line1 { stroke:var(--s1); stroke-width:2; fill:none; stroke-linejoin:round; stroke-linecap:round; }
.viz .line0, .viz .line2, .viz .line3 { stroke-width:1.5; fill:none; stroke-linejoin:round; stroke-linecap:round; }
.viz .line0 { stroke:var(--ink2); }
.viz .line2 { stroke:var(--s2); }
.viz .line3 { stroke:var(--s3); }
.viz .strip { fill:transparent; }
.viz .strip:hover { fill:var(--grid); fill-opacity:0.5; }
.viz .dot1 { fill:var(--s1); stroke:var(--surface); stroke-width:2; }
.viz .dot2 { fill:var(--s2); stroke:var(--surface); stroke-width:2; }
.viz .dot3 { fill:var(--s3); stroke:var(--surface); stroke-width:2; }
.viz .dot1s { fill:var(--s1); fill-opacity:0.55; }
.viz .arrow { fill:var(--s1); }
.viz .hit { fill:transparent; }
</style>
<rect width="820" height="456" fill="var(--surface)"/>
<text class="title" x="24" y="30">v17 validation accuracy</text>
<text class="subtitle" x="24" y="50">Top-option accuracy on held-back training rows, every 500 steps and at the end of the epoch. At 400 rows, one standard error is about 0.017.</text>
<line class="grid" x1="72" x2="796" y1="384.0" y2="384.0"/>
<text class="tick" x="66" y="387.5" text-anchor="end">0.80</text>
<line class="grid" x1="72" x2="796" y1="324.0" y2="324.0"/>
<text class="tick" x="66" y="327.5" text-anchor="end">0.82</text>
<line class="grid" x1="72" x2="796" y1="264.0" y2="264.0"/>
<text class="tick" x="66" y="267.5" text-anchor="end">0.84</text>
<line class="grid" x1="72" x2="796" y1="204.0" y2="204.0"/>
<text class="tick" x="66" y="207.5" text-anchor="end">0.86</text>
<line class="grid" x1="72" x2="796" y1="144.0" y2="144.0"/>
<text class="tick" x="66" y="147.5" text-anchor="end">0.88</text>
<line class="grid" x1="72" x2="796" y1="84.0" y2="84.0"/>
<text class="tick" x="66" y="87.5" text-anchor="end">0.90</text>
<line class="axis" x1="72" x2="796" y1="384" y2="384"/>
<text class="tick" x="72.0" y="400" text-anchor="middle">0</text>
<text class="tick" x="278.9" y="400" text-anchor="middle">1,000</text>
<text class="tick" x="485.7" y="400" text-anchor="middle">2,000</text>
<text class="tick" x="692.6" y="400" text-anchor="middle">3,000</text>
<text class="muted" x="796" y="418" text-anchor="end">optimiser step (32 examples each; one epoch) &#8594;</text>
<text class="muted" x="32" y="72">accuracy</text>
<rect class="strip" x="171.4" y="84" width="55.7" height="300"><title>step 500: validation accuracy 0.810</title></rect>
<rect class="strip" x="227.1" y="84" width="103.4" height="300"><title>step 1,000: validation accuracy 0.853</title></rect>
<rect class="strip" x="330.6" y="84" width="103.4" height="300"><title>step 1,500: validation accuracy 0.843</title></rect>
<rect class="strip" x="434.0" y="84" width="103.4" height="300"><title>step 2,000: validation accuracy 0.850</title></rect>
<rect class="strip" x="537.4" y="84" width="103.4" height="300"><title>step 2,500: validation accuracy 0.868</title></rect>
<rect class="strip" x="640.9" y="84" width="103.5" height="300"><title>step 3,000: validation accuracy 0.870</title></rect>
<rect class="strip" x="744.4" y="84" width="55.8" height="300"><title>step 3,501: validation accuracy 0.877</title></rect>
<path class="line1" d="M175.4,354.0 L278.9,226.5 L382.3,256.5 L485.7,234.0 L589.1,181.5 L692.6,174.0 L796.2,151.5" pointer-events="none"/>
<g><title>step 500: validation accuracy 0.810</title><circle class="hit" cx="175.4" cy="354.0" r="11"/><circle class="dot1" cx="175.4" cy="354.0" r="4"/></g>
<g><title>step 1,000: validation accuracy 0.853</title><circle class="hit" cx="278.9" cy="226.5" r="11"/><circle class="dot1" cx="278.9" cy="226.5" r="4"/></g>
<g><title>step 1,500: validation accuracy 0.843</title><circle class="hit" cx="382.3" cy="256.5" r="11"/><circle class="dot1" cx="382.3" cy="256.5" r="4"/></g>
<g><title>step 2,000: validation accuracy 0.850</title><circle class="hit" cx="485.7" cy="234.0" r="11"/><circle class="dot1" cx="485.7" cy="234.0" r="4"/></g>
<g><title>step 2,500: validation accuracy 0.868</title><circle class="hit" cx="589.1" cy="181.5" r="11"/><circle class="dot1" cx="589.1" cy="181.5" r="4"/></g>
<g><title>step 3,000: validation accuracy 0.870</title><circle class="hit" cx="692.6" cy="174.0" r="11"/><circle class="dot1" cx="692.6" cy="174.0" r="4"/></g>
<g><title>step 3,501: validation accuracy 0.877</title><circle class="hit" cx="796.2" cy="151.5" r="11"/><circle class="dot1" cx="796.2" cy="151.5" r="4"/></g>
<text class="value" x="796.2" y="141.5" text-anchor="end">0.877</text>
<text class="muted" x="24" y="444">The same 400 rows at every checkpoint: the first 50 batches of the 3% of training files held back. In-distribution, so this tracks fitting, not generalisation.</text>
</svg>
