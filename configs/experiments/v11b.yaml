# v11 arm B: v7's recipe and corpus, plus the same 30,135 changed-question prompts as
# arm A added as KL-only rows: no label, trained only toward the frozen torso's own
# reading of the changed question, at KL weight 1.0. Pre-registered in
# research/preregistrations/PREREGISTRATION-v11.md. Build: python -m strands_decider.data.question_transforms

train_files: ["data/train_v5.jsonl"]
val_fraction: 0.03

base_model: "Qwen/Qwen3-1.7B-Base"
num_slots: 24           # must match `data build --max-options`; also the KL reference width
head_type: "pointer"    # scores each option from its own hidden state; see modeling.PointerHead
pointer_dim: 256
head_init: "random"     # "lm_head" seeding applies to the slot head only
kl_frozen_weight: 0.3   # KL(frozen || student) over the option-number readout
kl_only_files: ["data/kl_v11b.jsonl"]
kl_only_weight: 1.0
head_dropout: 0.05
max_length: 3072

use_lora: true
lora_r: 16
lora_alpha: 32
freeze_torso: false     # true = head-only training (much weaker, but very cheap)

epochs: 1
micro_batch_size: 8
grad_accum: 4           # effective batch 32
lr: 0.0001              # LoRA
head_lr: 0.001          # randomly-initialised head needs a bigger step
weight_decay: 0.01
warmup_ratio: 0.03
max_grad_norm: 1.0
gradient_checkpointing: true

shuffle_options: true   # the whole point -- do not turn this off
group_by_length: false  # off: v7 trained without it, so each arm changes one thing
ordinal_smoothing: 0.1
reverse_score_prob: 0.5

output_dir: "checkpoints/hobson-1.7b-v11b"
seed: 0
log_every: 20
eval_every: 500
