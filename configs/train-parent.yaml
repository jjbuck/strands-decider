# The parent stage of the v17 to v19 recipes: v14's recipe, unchanged except its teacher file
# (the name training/recipe.sh teacher writes) and output directory. training/recipe.sh parent trains
# it; training/recipe.sh replay then labels its multi-step rows with this model's own answer
# distributions, which configs/train.yaml (v19) trains toward. See
# research/preregistrations/PREREGISTRATION-v14.md and research/preregistrations/PREREGISTRATION-v17.md.

train_files: ["data/train_v5.jsonl", "data/multistep_v14.jsonl"]
val_fraction: 0.03

base_model: "Qwen/Qwen3.5-2B-Base"
num_slots: 24           # must match `data build --max-options`; also the KL reference width
head_type: "pointer"    # scores each option from its own hidden state; see modeling.PointerHead
pointer_dim: 256
head_init: "random"     # "lm_head" seeding applies to the slot head only
kl_frozen_weight: 0.3   # KL(frozen || student) over the option-number readout
# Teacher distributions for the multi-step rows only (indices offset past train_v5).
teacher_file: "data/teacher_multistep_v14_train.jsonl"  # from training/recipe.sh teacher
teacher_weight: 1.0
head_dropout: 0.05
max_length: 3072

use_lora: true
lora_r: 16
lora_alpha: 32
# Attention and MLP projections, plus the recurrent layers' own; without these LoRA
# would reach only the 6 full-attention layers of 24.
lora_targets: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj",
               "in_proj_qkv", "in_proj_z", "in_proj_a", "in_proj_b", "out_proj"]
freeze_torso: false     # true = head-only training (much weaker, but very cheap)

epochs: 1
micro_batch_size: 8
grad_accum: 4           # effective batch 32
lr: 0.0001              # LoRA
head_lr: 0.001          # randomly-initialised head needs a bigger step
weight_decay: 0.01
warmup_ratio: 0.03
max_grad_norm: 1.0
gradient_checkpointing: true

shuffle_options: true   # the whole point -- do not turn this off
group_by_length: true   # on: ~2k-token documents among ~250-token rows would otherwise
                        # pad most batches; it changes batch composition, not content
ordinal_smoothing: 0.1
reverse_score_prob: 0.5

output_dir: "checkpoints/hobson-2b-recipe-parent"
seed: 0
log_every: 20
eval_every: 500
